name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in format X.Y.Z (ex. 0.1.0)'
        required: true
        type: string
      publish_docker:
        description: 'Build and push Docker image'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Basic version sanity check
        run: |
          if ! [[ "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be X.Y.Z"; exit 1; fi

      - name: Create release branch
        run: |
          REL="release/${{ github.event.inputs.version }}"
          git switch -c "$REL"
          git push origin "$REL"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (prod)
        run: npm run build -- --configuration=production

      - name: Verify Docker credentials
        if: ${{ github.event.inputs.publish_docker == 'true' }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ] || [ -z "${DOCKERHUB_REPOSITORY}" ]; then
            echo "Docker publish requested but DOCKERHUB_* secrets are missing.";
            exit 1;
          fi

      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.publish_docker == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ github.event.inputs.publish_docker == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_push
        if: ${{ github.event.inputs.publish_docker == 'true' }}
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPOSITORY }}:${{ github.event.inputs.version }}
            ${{ env.DOCKERHUB_REPOSITORY }}:latest
          build-args: |
            BUILD_CONFIGURATION=production
            DIST_DIR=ng-ultimate-base

      - name: Abort release when Docker publish fails
        if: ${{ github.event.inputs.publish_docker == 'true' && steps.docker_push.outcome == 'failure' }}
        run: |
          echo 'Docker build/push failed; aborting release flow.'
          exit 1

      - name: Zip artifact
        if: ${{ github.event.inputs.publish_docker != 'true' || steps.docker_push.outcome == 'success' }}
        run: |
          mkdir -p out
          cd dist
          zip -r ../out/ng-ultimate-base-${{ github.event.inputs.version }}.zip .
          cd ..

      - name: Create tag
        if: ${{ github.event.inputs.publish_docker != 'true' || steps.docker_push.outcome == 'success' }}
        run: |
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        if: ${{ github.event.inputs.publish_docker != 'true' || steps.docker_push.outcome == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            out/ng-ultimate-base-${{ github.event.inputs.version }}.zip
