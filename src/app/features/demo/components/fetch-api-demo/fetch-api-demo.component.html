<div class="space-y-6">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <h2 class="text-2xl font-semibold text-[color:var(--var-text-primary)]">
      {{ 'DEMO.posts' | translate: { count: store.posts().length } }}
    </h2>
    <button
      (click)="onLoadMore()"
      class="inline-flex items-center gap-2 rounded-lg bg-[color:var(--var-primary)] px-4 py-2 text-sm font-semibold text-[color:var(--var-primary-contrast)] shadow-sm transition hover:bg-[color:var(--var-primary)]/90 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-[color:var(--var-primary)]"
    >
      {{ 'DEMO.loadNposts' | translate: { count: 10 } }}
    </button>
  </div>

  <div *ngIf="store.loading()" class="text-sm font-medium text-[color:var(--var-primary)]">
    {{ 'DEMO.loading' | translate }}
  </div>

  <ul class="space-y-4">
    <li
      *ngFor="let post of store.posts()"
      class="rounded-xl border border-[color:var(--var-border)] bg-[color:var(--var-surface)] p-4 shadow-sm transition-shadow hover:shadow-md"
    >
      <h3 class="mb-2 text-lg font-semibold text-[color:var(--var-text-primary)]">
        {{ post.title }}
      </h3>
      <p class="text-[color:var(--var-text-secondary)]">{{ post.body }}</p>
    </li>
  </ul>
</div>
